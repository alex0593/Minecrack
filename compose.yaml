services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minecrack
      POSTGRES_USER: minecrack
      POSTGRES_PASSWORD: minecrack
    volumes:
      - minecrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minecrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - minecrack-files:/data/files

  admin:
    build: ./admin
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  minecrack-db:
  minecrack-files:
